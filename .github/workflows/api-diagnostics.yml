name: Editor API Diagnostics
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/api-diagnostics.yml
      - deploy/inspect_api_stall.py
permissions:
  contents: read
jobs:
  inspect:
    if: github.ref == 'refs/heads/main'
    runs-on: [self-hosted, zoj-editor, editor-backend]
    environment: production
    timeout-minutes: 5
    concurrency:
      group: editor-api-diagnostics
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Collect stack names and database wait counts
        run: python3 deploy/inspect_api_stall.py
