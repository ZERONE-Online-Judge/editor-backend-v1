name: Editor Backend CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      EDITOR_AUTH_MODE: local
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: pip install -r requirements.txt
      - name: Install the backup integration test dependency
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends restic
      - run: python -m compileall -q app runner deploy/backup
      - run: bash -n deploy/backup/install.sh
      - run: pytest -q
      - name: Validate schema migration
        run: |
          EDITOR_DATABASE_URL=sqlite:////tmp/editor-migration.db alembic upgrade head
          EDITOR_DATABASE_URL=sqlite:////tmp/editor-migration.db alembic check
      - name: Verify application image from a private checkout
        run: |
          chmod -R go-rwx app vendor migrations requirements.txt alembic.ini
          docker build -t zoj-editor-api:ci .
          docker run --rm --network none -e EDITOR_AUTH_MODE=local \
            -e EDITOR_DATA_DIR=/tmp/editor-data \
            -e EDITOR_DATABASE_URL=sqlite:////tmp/editor-data/editor.db \
            --entrypoint python zoj-editor-api:ci -c \
            'import os; from app.main import app; from alembic.config import Config; assert os.getuid() == 1000; assert app.title == "ZOJ Editor API"; assert Config("alembic.ini").get_main_option("script_location") == "migrations"'
      - name: Build isolated execution images
        run: |
          docker build -t zoj-editor-runtime:v1 runner
          docker build -t zoj-editor-renderer:v1 -f runner/Renderer.Dockerfile runner
      - name: Execute real sandbox tests
        run: RUN_SANDBOX_TESTS=1 pytest -q -m sandbox
  deploy:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: [self-hosted, zoj-editor, editor-backend]
    environment: production
    timeout-minutes: 90
    concurrency:
      group: editor-backend-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Deploy the tested main commit
        run: bash deploy/deploy-main.sh backend "$GITHUB_SHA"
