name: Verify Editor backend runner
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  runner:
    if: github.ref == 'refs/heads/integration/editor-v1' || github.ref == 'refs/heads/main'
    runs-on: [self-hosted, zoj-editor, editor-backend]
    timeout-minutes: 5
    steps:
      - name: Check the dedicated server without loading repository code
        run: |
          test "$(hostname)" = zoj-editor
          docker version --format '{{.Server.Version}}'
          docker compose version
          test -r /srv/zoj-editor/config/editor.env
          test -d /srv/editor-source/editor_backend_v1/.git
