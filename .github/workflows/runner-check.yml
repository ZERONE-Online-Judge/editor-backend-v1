name: Verify Editor backend runner
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  runner:
    if: github.event_name == 'workflow_dispatch' && (github.ref == 'refs/heads/integration/editor-v1' || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/codex/editor-blue-green')
    runs-on: [self-hosted, zoj-editor, editor-backend]
    timeout-minutes: 5
    steps:
      - name: Inspect fixed deployment metadata without loading repository code
        shell: bash
        run: |
          set -euo pipefail
          test "$(hostname)" = zoj-editor
          docker version --format '{{.Server.Version}}'
          docker compose version
          test -r /srv/zoj-editor/config/editor.env
          test -d /srv/editor-source/editor_backend_v1/.git
          docker ps --filter label=com.docker.compose.project=zoj-editor --format '{{.Names}} {{.Image}} {{.Status}} {{.Ports}}'
          for service in api worker frontend internal-gateway db api-blue api-green frontend-blue frontend-green worker-blue worker-green; do
            for container in $(docker ps --filter label=com.docker.compose.project=zoj-editor --filter "label=com.docker.compose.service=$service" --format '{{.ID}}'); do
              docker inspect --format '{{.Name}} image={{.Config.Image}} restart={{.RestartCount}} started={{.State.StartedAt}} networks={{json .NetworkSettings.Networks}} mounts={{json .Mounts}}' "$container"
            done
          done
          docker stats --no-stream --format '{{.Name}} {{.MemUsage}} {{.CPUPerc}}'
          free -h
          df -h /srv/zoj-editor /srv/editor-source
          grep -E '^(EDITOR_BIND_ADDRESS|EDITOR_HTTP_PORT|EDITOR_INGRESS_CIDR|EDITOR_WORKER_CONCURRENCY|EDITOR_JOB_TIMEOUT_SECONDS|EDITOR_STORAGE_ROOT)=' /srv/zoj-editor/config/editor.env || true
          grep -E '^(EDITOR_(API_IMAGE|FRONTEND_IMAGE|RUNNER_IMAGE|RENDER_IMAGE|RUNTIME_REVISION|DEPLOY_MODE|ACTIVE_SLOT|WORKER_SERVICE|SCHEMA_REVISION))=' /srv/zoj-editor/config/release.env
          git -C /srv/editor-source/editor_backend_v1 rev-parse HEAD
          git -C /srv/editor-source/editor_frontend_v1 rev-parse HEAD
          database=$(docker ps --filter label=com.docker.compose.project=zoj-editor --filter label=com.docker.compose.service=db --format '{{.ID}}')
          test -n "$database"
          docker exec "$database" psql -XqAt -U editor -d editor -c 'SELECT version_num FROM alembic_version; SELECT status,count(*) FROM jobs GROUP BY status ORDER BY status;'
          systemctl list-timers 'zoj-editor-backup*' --no-pager
          systemctl show zoj-editor-backup.service -p ExecStart --no-pager
          python3 /usr/local/lib/zoj-editor-backup/editor_backup.py status
          sha256sum /usr/local/lib/zoj-editor-backup/editor_backup.py
          for service in worker-blue worker-green; do
            for container in $(docker ps --filter label=com.docker.compose.project=zoj-editor --filter "label=com.docker.compose.service=$service" --format '{{.ID}}'); do
              docker exec "$container" python -c 'import json,time; from pathlib import Path; p=Path("/tmp/editor-worker-ready"); print(json.dumps({"ready":p.is_file() and time.time()-p.stat().st_mtime<60,"drained":Path("/tmp/editor-worker-drained").is_file(),"activated":Path("/tmp/editor-worker-activated").is_file()}))'
            done
          done
          gateway=$(docker ps --filter label=com.docker.compose.project=zoj-editor --filter label=com.docker.compose.service=internal-gateway --format '{{.ID}}')
          test -n "$gateway"
          certificate=$(docker exec "$gateway" cat /tls/server.crt)
          endpoint=$(docker port "$gateway" 443/tcp)
          expected=$(sed -n 's/^EDITOR_API_IMAGE=zoj-editor-api://p' /srv/zoj-editor/config/release.env)
          python3 - "$endpoint" "$certificate" "$expected" <<'PY'
          import json, ssl, sys, urllib.request
          endpoint, certificate, expected = sys.argv[1:]
          context = ssl.create_default_context(cadata=certificate)
          context.verify_flags |= ssl.VERIFY_X509_PARTIAL_CHAIN
          with urllib.request.urlopen('https://' + endpoint + '/api/health', context=context, timeout=10) as response:
              data = json.load(response)
              assert data['status'] == 'ok'
              if 'release' in data:
                  assert data['release'] == expected
              print(json.dumps({'internal_tls': 'verified', 'endpoint': endpoint, 'release': data.get('release', 'legacy')}))
          PY
