name: Physical Judge Integration Check
on: workflow_dispatch
permissions:
  contents: read
jobs:
  verify:
    if: github.ref == 'refs/heads/main'
    runs-on: [self-hosted, zoj-editor, editor-backend]
    environment: production
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify the deployed worker and physical ZOJ judges
        run: bash deploy/check-judge.sh
