name: Physical Judge Integration Check
on:
  workflow_dispatch:
    inputs:
      large_files:
        description: Verify 48 MiB generated input and reference output
        type: boolean
        default: false
      native_reference:
        description: Compare Main generation and verification for all six languages
        type: boolean
        default: false
      language_policy:
        description: Verify language overrides, corrections and ZOJ stress execution
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  verify:
    if: github.ref == 'refs/heads/main'
    runs-on: [self-hosted, zoj-editor, editor-backend]
    environment: production
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify the deployed worker and physical ZOJ judges
        env:
          CHECK_LARGE_FILES: ${{ inputs.large_files }}
          CHECK_NATIVE_REFERENCE: ${{ inputs.native_reference }}
          CHECK_LANGUAGE_POLICY: ${{ inputs.language_policy }}
        run: |
          args=()
          if [[ "$CHECK_LARGE_FILES" == true ]]; then args+=(--large-files); fi
          if [[ "$CHECK_LANGUAGE_POLICY" == true ]]; then args+=(--language-policy); fi
          if [[ "$CHECK_NATIVE_REFERENCE" == true ]]; then args+=(--native-reference); fi
          bash deploy/check-judge.sh "${args[@]}"
